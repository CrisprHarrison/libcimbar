<!doctype html>
<html lang="en" data-framework="javascript">

<head>
  <title>Cimbar Encoder</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="manifest" href="pwa.json">
</head>

<body>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
    }

    body {
      background-color: black;
      background-size: cover;
      color: gray;
      display: flex;
      align-items: flex-start;
      transition: opacity 0.4s ease-in;
    }

    li {
      border-radius: 50px;
    }

    ul {
      padding: 6px;
    }

    #status {
      position: fixed;
      right: 0;
      top: 0;
    }

    #nav-container:focus-within {
      z-index: 1;
    }

    #nav-content,
    #nav-container .bg,
    #nav-container:focus-within #nav-button {
      z-index: 1;
    }

    #canvas {
      display: block;
      position: relative;
    }

    #dragdrop {
      background-color: #1c1b1d;
      margin: 15px auto;
      margin-left: 0px;
      color: #F0F0F0;
      border-radius: 25px;
      padding: 12px;
      height: 95%;
    }

    .dragdrop::before {
      content: "【 Tap to start 】";
      font: 1.5em sans-serif;
      padding-top: 2em;
      position: absolute;
      left: -3%;
      text-align: center;
      width: 100%;
    }

    .dragdrop.error:before {
      content: "⌜ Error! WebGL is not enabled :( ⌟";
    }

    #invisible_click {
      position: fixed;
      opacity: 0;
      pointer-events: auto;
    }

    #invisible_click.active {
      cursor: none;
    }

    #nav-container:focus-within+#invisible_click {
      pointer-events: none;
      display: none;
    }

    /* options */
    #nav-container a.mode-b,
    #nav-container a.mode-bm,
    #nav-container a.mode-4c {
      color: #555;
    }

    #nav-container.mode-b a.mode-b,
    #nav-container.mode-bm a.mode-bm,
    #nav-container.mode-4c a.mode-4c {
      color: #9fa6b2;
    }

    /* nav stuff */
    #nav-container {
      top: 0;
      pointer-events: none;
      margin: 15px;
      border-radius: 25px;
      width: 175px;
      position: relative;
      z-index: 10;
    }

    #nav-container .bg {
      pointer-events: auto;
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      transition: .3s;
      background: black;
    }

    #nav-container:focus-within .bg {
      visibility: visible;
      opacity: .6;
    }

    #nav-container * {
      visibility: visible;
    }

    #nav-content {
      padding: 20px;
      position: relative;
      top: 0;
      left: 0;
      height: 100%;
      overflow-x: clip;
      background-color: #211f21;
      text-align: center;
      pointer-events: auto;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      transform: translateX(0);
      transition: transform .3s;
      will-change: transform;
      border-radius: 25px;
    }

    #nav-content ul {
      height: calc(100% - 60px);
      display: flex;
      flex-direction: column;
      list-style: none;
    }

    #nav-content hr {
      border: 1px solid #444;
    }

    #nav-content li a {
      display: block;
      padding: 10px 5px;
      color: #9fa6b2;
      text-decoration: none;
      transition: color .1s;
    }

    #nav-content li a.attention {
      animation: glowing 1.5s infinite alternate;
    }

    #nav-content li a {
      font-size: 2em;
    }

    #nav-content li:hover {
      background-color: #2c323c;
    }

    #nav-content li:not(.small)+.small {
      margin-top: auto;
    }

    #nav-content li.small {
      display: flex;
      align-self: center;
    }

    #nav-content li.small a {
      font-size: 1em;
    }

    #nav-container:focus-within #nav-content {
      transform: none;
    }

    @keyframes glowing {
      0% {
        color: #00ffff;
      }
    }

    /* ========== 流动背景样式 ========== */
    /* 背景容器 */
    .gradient-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
      background-color: black;
      isolation: isolate;
    }

    /* 旋转渐变层 */
    .gradient-background .rotate {
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(
          circle at 30% 50%,
          rgba(255, 255, 255, 0.15) 0%,
          transparent 50%
        ),
        radial-gradient(
          circle at 70% 50%,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 50%
        ),
        url('400x400bb-75.jpg');
      background-size: cover;
      background-position: center;
      animation: rotate-gradient 60s linear infinite;
      transform-origin: center center;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      z-index: 2;
      opacity: 0.2;
      -webkit-filter: blur(80px);
      filter: blur(80px);
    }

    @keyframes rotate-gradient {
      0% {
        transform: rotate(0deg) scale(1.5);
      }
      100% {
        transform: rotate(360deg) scale(1.5);
      }
    }

    /* 模糊层 */
    .gradient-background .blur {
      position: absolute;
      inset: 0;
      background: url('400x400bb-75.jpg');
      background-size: cover;
      background-position: center;
      -webkit-filter: blur(80px);
      filter: blur(80px);
      opacity: 0.3;
      transform: translateZ(0);
      backface-visibility: hidden;
      z-index: 1;
      pointer-events: none;
    }

    /* 减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
      .gradient-background .rotate {
        animation: none;
      }
    }
  </style>

  <!-- 流动背景 -->
  <div class="gradient-background">
    <div class="blur"></div>
    <div class="rotate"></div>
  </div>

  <div id="status"></div>

  <div id="nav-container" class="mode-b">
    <div id="nav-content" tabindex="-1">
      <span id="current-file">No file selected</span>
      <ul>
        <li><a class="attention" id="nav-find-file-link" href="javascript:void(0)"
            onclick="Main.clickFileInput()">File</a></li>
        <hr>
        <li><a class="mode-b" href="javascript:void(0)" onclick="Main.setMode('B')">B</a></li>
        <li><a class="mode-bm" href="javascript:void(0)" onclick="Main.setMode('Bm')">Bm</a></li>
        <li><a class="mode-4c" href="javascript:void(0)" onclick="Main.setMode('4C')">4C</a></li>
        <li class="small"><a href="javascript:void(0)" onclick="Main.toggleFullscreen()">Fullscreen</a></li>
      </ul>
    </div>
  </div>

  <div id="dragdrop" class="dragdrop" title="Drag and drop a file">
    <canvas id="canvas" class="canvas"></canvas>
  </div>

  <input style="display:none;" type="file" name="file_input" id="file_input" onchange="Main.fileInput(this);" />

  <a id="invisible_click" href="javascript:;" onclick="Main.clickNav()"></a>

  <script type="text/javascript">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
    var canvas = document.getElementById('canvas');

    var Module = {};
    Module.canvas = canvas;
    Module.onRuntimeInitialized = () => {
      Main.init(canvas);
      Main.nextFrame();
    };
  </script>

  <script src="cimbar_js_v2.js"></script>
  <script src="main_v2.js"></script>

</body>

</html>
